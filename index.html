<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小站 · 短视频</title>
<style>
:root{--pink:#fb7299;--blue:#00a1d6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0d;color:#fff;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#app,.app{height:100%}
.app{position:relative}

.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.feed::-webkit-scrollbar{display:none}

.slide{position:relative;height:100%;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:start;background:#000;overflow:hidden}
.slide video{width:100%;height:100%;object-fit:contain;background:#000}
.mask{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,.35) 100%)}

.info{position:absolute;left:16px;right:90px;bottom:28px}
.info .author{font-size:15px;font-weight:600}
.info .title{font-size:14px;line-height:1.5;margin-top:6px;color:#eaeaea}
.info .desc{font-size:12px;margin-top:6px;color:#b0b0b0;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.side{position:absolute;right:12px;bottom:34px;display:flex;flex-direction:column;gap:18px}
.side .act{width:46px;height:46px;border:0;border-radius:50%;cursor:pointer;color:#fff;
  font-size:20px;line-height:1;background:rgba(255,255,255,.13);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;transition:.2s}
.side .act:hover{background:rgba(255,255,255,.24)}
.side .act.on{color:var(--pink);background:rgba(251,114,153,.22)}

.pause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pause i{width:0;height:0;margin-left:8px;border-left:26px solid rgba(255,255,255,.85);
  border-top:16px solid transparent;border-bottom:16px solid transparent}

.topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:20px;
  justify-content:center;padding:14px 0;font-size:16px;pointer-events:none}
.topbar .tab{opacity:.5}
.topbar .tab.on{opacity:1;font-weight:600;position:relative}
.topbar .tab.on::after{content:"";position:absolute;left:50%;bottom:-7px;width:18px;height:2px;
  border-radius:2px;background:var(--pink);transform:translateX(-50%)}

.mute{position:fixed;top:12px;right:14px;z-index:20;width:36px;height:36px;border:0;
  border-radius:50%;cursor:pointer;font-size:16px;color:#fff;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}

.empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8a8a8a;font-size:14px;text-align:center;padding:0 32px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="src/app.js" defer></script>
</body>
</html>
